name: Run HS300 report

on:
  workflow_dispatch:

jobs:
  hs300:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run HS300 script
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/hs300.py
      - name: Upload HS300 chart
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hs300-chart
          path: |
            hs300_head_etf_market_cap.png
